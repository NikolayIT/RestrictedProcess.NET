name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    # Windows is required: the library is built on Win32 APIs and the test project targets .NET Framework 4.6.1
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: dotnet build src/RestrictedProcess.sln --configuration Release

      - name: Test
        run: dotnet test src/RestrictedProcess.sln --configuration Release --no-build --verbosity normal

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: src/RestrictedProcess/bin/Release/*.nupkg
