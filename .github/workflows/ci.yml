name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    # Windows is required: the library is built on Win32 APIs
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build src/RestrictedProcess.sln --configuration Release

      # Tests are intentionally not run here: they start real processes in the sandbox
      # (CreateProcessAsUser with a restricted token), which fails with "Access is denied"
      # on hosted CI runners. Run `dotnet test` locally on Windows instead.

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: src/RestrictedProcess/bin/Release/*.nupkg
